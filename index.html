<!doctype html>
<html lang="en">

<head>
    <title>My Portfolio</title>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"

        Font Awesome
        Esta biblioteca permite usar ícones, como:
        Instagram, Facebook, YouTube, etc.
    -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    
    <!-- Google Fonts CSS -->
    <link href="https://fonts.googleapis.com/css?family=Kalam&display=swap" rel="stylesheet">

    <!-- Main CSS -->
    <link rel="stylesheet" href="css/main.css">
</head>

<body>

    <!--
        NAV = barra de navegação
        É onde vamos colocar os links do site.
    -->
    <nav class="navbar">

        <!--
            Logo / nome do site
        -->
        <div class="logo">
            Site do Victor e do heri
        </div>

        <!--
            Lista de links
        -->
        <ul class="nav-links">

            <li>
                <a href="#">Início</a>
            </li>

            <li>
                <a href="#">Sobre</a>
            </li>

            <li>
                <a href="#">Projetos</a>
            </li>

            <li>
                <a href="#">Contacto</a>
            </li>

        </ul>

        <!--
            Redes sociais
        -->
        <div class="social-links">

            <!-- Instagram -->
            <a href="#" aria-label="Instagram">
                <i class="fa-brands fa-instagram"></i>
            </a>

            <!-- Facebook -->
            <a href="#" aria-label="Facebook">
                <i class="fa-brands fa-facebook"></i>
            </a>

            <!-- YouTube -->
            <a href="#" aria-label="YouTube">
                <i class="fa-brands fa-youtube"></i>
            </a>

            <!-- GitHub -->
            <a href="#" aria-label="GitHub">
                <i class="fa-brands fa-github"></i>
            </a>

        </div>

    </nav>


    <h1>... <i class="bi bi-pc-display-horizontal"></i></h1>
    <!-- Optional JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const navbarToggler = document.querySelector(".navbar-toggler");

            if (navbarToggler) {
                navbarToggler.addEventListener("click", function () {
                    navbarToggler.classList.toggle("change");
                });
            }
        });
    </script>
